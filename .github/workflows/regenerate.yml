name: Regenerate formula

# Runs when a new @podyard/cli version is published to npm.
# Triggers manually (workflow_dispatch) or when the CLI repo pushes a tag.
# The workflow fetches the latest published version, computes its real SHA-256,
# rewrites Formula/podyard.rb, and commits it back to main.
on:
  workflow_dispatch:
  # Cross-repo trigger: podyard-cli pushes a v* tag
  repository_dispatch:
    types: [ cli-released ]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate formula
        run: pnpm exec tsx scripts/generate-brew-formula.ts latest

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/podyard.rb
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update formula to latest @podyard/cli version"
            git push
          fi
